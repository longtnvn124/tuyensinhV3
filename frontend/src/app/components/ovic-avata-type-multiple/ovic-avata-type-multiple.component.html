<div class="avata-container" [ngStyle]="{ height: height(), 'min-height': height() || '180px' }">

    @if (listFile().length === 0) {
        <!-- Empty placeholder -->
        <div class="avata-placeholder" (click)="triggerFilePicker()">
            <svg class="avata-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="avata-placeholder-text">{{ textView() }}</span>
        </div>
    } @else {
        <!-- Thumbnail grid -->
        <div class="avata-grid">

            <!-- Add button -- fixed -->
            @if (!disabled() && multiple()) {
                <div class="avata-add-btn" (click)="triggerFilePicker()">
                    <svg class="avata-add-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span class="avata-add-btn-text">Thêm ảnh</span>
                </div>
            }

            <!-- Items -- scrollable -->
            <div class="avata-items-scroll">
                @for (item of listFile(); track trackByFile($index, item)) {
                    <div class="avata-item">
                        <img
                            class="avata-item-img"
                            [src]="item.url"
                            alt=""
                            loading="lazy"
                        />

                        <!-- Delete badge -->
                        @if (!disabled()) {
                            <div class="avata-item-delete">
                                <button
                                    pRipple
                                    pButton
                                    icon="pi pi-trash"
                                    class="p-button-rounded p-button-sm p-button-danger p-button-text"
                                    (click)="btnDeleteFile(item)"
                                ></button>
                            </div>
                        }

                        <!-- Overlay buttons -->
                        <div class="avata-item-overlay">
                            @if (!disabled()) {
                                <button
                                    type="button"
                                    class="avata-item-btn"
                                    title="Chọn ảnh khác"
                                    (click)="replaceFile($index, $event)"
                                >
                                    <i class="fa fa-camera"></i>
                                </button>
                            }
                            <button
                                type="button"
                                class="avata-item-btn"
                                title="Xem ảnh"
                                (click)="btnViewImage(item)"
                            >
                                <i class="fa fa-picture-o"></i>
                            </button>
                        </div>
                    </div>
                }
            </div>

        </div>
    }

</div>

<!-- Fullscreen gallery preview -->
<p-galleria
    [value]="listFile()"
    [visible]="displayBasic()"
    (visibleChange)="displayBasic.set($event)"
    [(activeIndex)]="activeIndex"
    [responsiveOptions]="responsiveOptions"
    [containerStyle]="{ 'max-width': '50%' }"
    [circular]="true"
    [fullScreen]="true"
    [showItemNavigators]="true"
    [baseZIndex]="100000"
>
    <ng-template pTemplate="item" let-item>
        <p-image [src]="item.url" alt="Image" width="500" [preview]="true"></p-image>
    </ng-template>

        <div class="grid grid-nogutter justify-content-center">
            <img [src]="item.url" style="display: block" />
        </div>
    </ng-template> -->
</p-galleria>
